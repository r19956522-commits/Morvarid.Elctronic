<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تبدیل PDF به Word</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- docx -->
  <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>

  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .box {
      max-width: 700px;
      margin: auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin-top: 0;
      text-align: center;
    }

    .note {
      font-size: 13px;
      line-height: 1.8;
      background: #fff8e1;
      border: 1px solid #ffe082;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px dashed #999;
      border-radius: 10px;
      background: #fafafa;
      box-sizing: border-box;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #1565c0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #90a4ae;
      cursor: not-allowed;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    #downloadLink {
      display: none;
      margin-top: 16px;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      background: #2e7d32;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>مبدل PDF به Word</h1>

    <div class="note">
      این ابزار متن PDF را استخراج می‌کند و فایل Word می‌سازد.
      تصاویر، فرمول‌های ریاضی و قالب‌بندی پیچیده ممکن است حفظ نشوند.
      PDFهای اسکن‌شده نیاز به OCR دارند.
    </div>

    <input type="file" id="pdfFile" accept="application/pdf" />

    <button id="convertBtn">تبدیل به Word</button>

    <div id="status"></div>

    <a id="downloadLink" href="#">دانلود فایل Word</a>
  </div>

  <script>
    // تنظیم worker برای PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const {
      Document,
      Packer,
      Paragraph,
      TextRun,
      AlignmentType,
      HeadingLevel
    } = window.docx;

    const pdfFileInput = document.getElementById("pdfFile");
    const convertBtn = document.getElementById("convertBtn");
    const statusEl = document.getElementById("status");
    const downloadLink = document.getElementById("downloadLink");

    let lastObjectUrl = null;

    convertBtn.addEventListener("click", async () => {
      const file = pdfFileInput.files[0];

      if (!file) {
        statusEl.textContent = "لطفاً ابتدا یک فایل PDF انتخاب کن.";
        return;
      }

      if (!file.name.toLowerCase().endsWith(".pdf")) {
        statusEl.textContent = "فایل انتخاب‌شده PDF نیست.";
        return;
      }

      convertBtn.disabled = true;
      downloadLink.style.display = "none";
      statusEl.textContent = "در حال خواندن PDF...";

      try {
        const arrayBuffer = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        statusEl.textContent = `تعداد صفحات: ${pdf.numPages}\nدر حال استخراج متن...`;

        const wordParagraphs = [];

        // عنوان سند
        wordParagraphs.push(
          new Paragraph({
            heading: HeadingLevel.HEADING_1,
            alignment: AlignmentType.CENTER,
            bidirectional: true,
            children: [
              new TextRun({
                text: "متن استخراج‌شده از PDF",
                rightToLeft: true,
                font: "B Nazanin",
                size: 32,
                bold: true
              })
            ]
          })
        );

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          statusEl.textContent = `در حال پردازش صفحه ${pageNumber} از ${pdf.numPages}...`;

          const page = await pdf.getPage(pageNumber);
          const textContent = await page.getTextContent();

          const lines = extractLinesFromTextItems(textContent.items);

          // عنوان صفحه
          wordParagraphs.push(
            new Paragraph({
              heading: HeadingLevel.HEADING_2,
              alignment: AlignmentType.RIGHT,
              bidirectional: true,
              spacing: { before: 240, after: 120 },
              children: [
                new TextRun({
                  text: `صفحه ${pageNumber}`,
                  rightToLeft: true,
                  font: "B Nazanin",
                  size: 28,
                  bold: true
                })
              ]
            })
          );

          if (lines.length === 0) {
            wordParagraphs.push(
              new Paragraph({
                alignment: AlignmentType.RIGHT,
                bidirectional: true,
                children: [
                  new TextRun({
                    text: "[متنی در این صفحه پیدا نشد. احتمالاً صفحه اسکن‌شده است.]",
                    rightToLeft: true,
                    font: "B Nazanin",
                    size: 24
                  })
                ]
              })
            );
          } else {
            for (const line of lines) {
              wordParagraphs.push(
                new Paragraph({
                  alignment: AlignmentType.RIGHT,
                  bidirectional: true,
                  spacing: { after: 80 },
                  children: [
                    new TextRun({
                      text: line,
                      rightToLeft: true,
                      font: "B Nazanin",
                      size: 24
                    })
                  ]
                })
              );
            }
          }

          // فاصله بین صفحات
          wordParagraphs.push(
            new Paragraph({
              children: [
                new TextRun({
                  text: "",
                  rightToLeft: true,
                  font: "B Nazanin",
                  size: 24
                })
              ]
            })
          );
        }

        statusEl.textContent = "در حال ساخت فایل Word...";

        const doc = new Document({
          sections: [
            {
              properties: {},
              children: wordParagraphs
            }
          ]
        });

        const blob = await Packer.toBlob(doc);

        if (lastObjectUrl) {
          URL.revokeObjectURL(lastObjectUrl);
        }

        lastObjectUrl = URL.createObjectURL(blob);

        const baseName = file.name.replace(/\.pdf$/i, "");
        downloadLink.href = lastObjectUrl;
        downloadLink.download = `${baseName}.docx`;
        downloadLink.textContent = "دانلود فایل Word";
        downloadLink.style.display = "block";

        statusEl.textContent = "تبدیل انجام شد. روی دکمه دانلود کلیک کن.";
      } catch (error) {
        console.error(error);
        statusEl.textContent =
          "خطا در تبدیل فایل:\n" +
          (error && error.message ? error.message : String(error)) +
          "\n\nاگر PDF اسکن‌شده است، این روش متن ندارد و باید OCR شود.";
      } finally {
        convertBtn.disabled = false;
      }
    });

    /**
     * متن‌های PDF را به خط‌های تقریبی تبدیل می‌کند.
     * این تابع ساده است و برای PDFهای متنی معمولی مناسب است.
     */
    function extractLinesFromTextItems(items) {
      const lines = [];

      for (const item of items) {
        if (!item || typeof item.str !== "string") continue;

        const str = item.str;
        if (!str.trim()) continue;

        const y = item.transform ? item.transform[5] : 0;

        // پیدا کردن خط نزدیک بر اساس مختصات عمودی
        let line = lines.find((l) => Math.abs(l.y - y) <= 2.5);

        if (!line) {
          line = { y, parts: [] };
          lines.push(line);
        }

        line.parts.push(str);
      }

      // مرتب‌سازی خطوط از بالا به پایین
      lines.sort((a, b) => b.y - a.y);

      return lines
        .map((line) =>
          line.parts
            .join(" ")
            .replace(/\s+/g, " ")
            .trim()
        )
        .filter(Boolean);
    }
  </script>
</body>
</html>
