<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت مروارید - کامپایلر آنلاین</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #1e1e2f;
            color: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container, .main-container {
            background-color: #2b2b3d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 800px;
            display: none;
        }
        .login-container {
            max-width: 400px;
            text-align: center;
        }
        h2, h3 { color: #4CAF50; margin-bottom: 20px; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 6px;
            background: #3b3b4f;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #1e1e2f;
            color: #d4d4d4;
            font-family: monospace;
            direction: ltr;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        button:hover { background-color: #45a049; }
        .header-info {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #aaa;
        }
        .status-msg {
            margin-top: 15px;
            text-align: center;
            color: #ff9800;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <!-- صفحه ورود -->
    <div class="login-container" id="loginBox">
        <h2>سایت مروارید</h2>
        <p>طراح: مهندس محمدرسول یزدیان</p>
        <input type="password" id="passwordInput" placeholder="رمز عبور را وارد کنید">
        <button onclick="checkLogin()">ورود به سیستم</button>
    </div>

    <!-- صفحه اصلی کامپایلر -->
    <div class="main-container" id="compilerBox">
        <div class="header-info">
            <span>سایت مروارید</span>
            <span>طراح: مهندس محمدرسول یزدیان</span>
        </div>
        
        <h3>کدهای C خود را اینجا قرار دهید:</h3>
        <textarea id="codeInput" placeholder="کدهای خود را اینجا پیست کنید..."></textarea>
        
        <button onclick="compileCode()">کامپایل کد و دریافت فایل HEX</button>
        <div class="status-msg" id="statusMsg">در حال پردازش و کامپایل کد...</div>
    </div>

    <script>
        // بررسی رمز عبور
        function checkLogin() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === '123454321') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('compilerBox').style.display = 'block';
            } else {
                alert('رمز عبور اشتباه است!');
            }
        }

        // تابع ساخت و دانلود فایل HEX
        function compileCode() {
            const code = document.getElementById('codeInput').value;
            
            if(code.trim() === '') {
                alert('لطفاً ابتدا کدهای خود را در کادر بالا قرار دهید.');
                return;
            }

            const status = document.getElementById('statusMsg');
            status.style.display = 'block';
            status.innerText = 'در حال کامپایل... لطفاً صبر کنید...';

            // شبیه سازی زمان کامپایل
            setTimeout(() => {
                // محتوای فایل HEX پروژه شما
                const hexContent = `:100000000C9463000C9470000C9470000C947000E0
:100010000C9470000C9470000C9470000C947000D0

:10029000CD9A019ACD9ACD9A0D90CD9A0C94C000C4
:0A02A000F894FFCFCD9AFFCF35
:00000001FF`;

                const blob = new Blob([hexContent], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'lab.hex'; // اسم فایل خروجی
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);

                status.innerText = 'کامپایل با موفقیت انجام شد! فایل lab.hex دانلود شد.';
                status.style.color = '#4CAF50';
            }, 1500); // 1.5 ثانیه تاخیر برای حس واقعی بودن
        }
    </script>
</body>
</html>
