<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود فایل HEX</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 350px; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .download-btn { background-color: #27ae60; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; transition: 0.3s; }
        .download-btn:active { background-color: #219150; transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <h2>دانلود فایل هگز</h2>
        <p>برای دریافت فایل <b>lab.hex</b> بدون مشکل پسوند txt، روی دکمه زیر کلیک کنید.</p>
        <button class="download-btn" onclick="downloadHex()">دانلود lab.hex</button>
    </div>

    <script>
        function downloadHex() {
            // این متن، کدهای واقعی HEX است
            const hexContent = `:100000000C9434000C943E000C943E000C943E0082
:100010000C943E000C943E000C943E000C943E0068
:100020000C943E000C943E000C943E000C943E0058
:100030000C943E000C943E000C943E000C943E0048
:100040000C943E000C943E000C943E000C943E0038
:100050000C943E000C943E000C943E000C943E0028
:100060000C943E000C943E000C943E000C943E0018
:100070000C943E000C943E000C943E000C943E0008
:100080000C943E000C943E000C943E000C943E00F8
:100090000C943E000C943E000C943E000C943E00E8
:1000A0000C943E000C943E000C943E000C943E00D8
:1000B0000C943E000C943E000C943E000C943E00C8
:1000C0000C943E000C943E000C943E000C943E00B8
:1000D0000C943E000C943E000C943E000C943E00A8
:1000E0000C943E000C943E000C943E000C943E0098
:1000F0000C943E000C943E000C943E000C943E0088
:1001000021FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFDE
:00000001FF`;

            // 🔴 نکته مهم: نوع فایل را octet-stream گذاشتیم تا مرورگر پسوند txt ندهد
            const blob = new Blob([hexContent], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.download = 'lab.hex'; 
            a.href = url;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
