<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود فایل HEX استاندارد</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 350px; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .download-btn { background-color: #27ae60; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; transition: 0.3s; }
        .download-btn:active { background-color: #219150; transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <h2>دانلود فایل هگز استاندارد</h2>
        <p>برای دریافت فایل <b>lab.hex</b> با چکسام صحیح (بدون خطای پروتئوس) کلیک کنید.</p>
        <button class="download-btn" onclick="downloadHex()">دانلود lab.hex</button>
    </div>

    <script>
        function downloadHex() {
            // 🔹 داده‌های خام حافظه فلش (بدون چکسام)
            const data = new Uint8Array(256); // یک آرایه 256 بایتی پر از صفر
            // اینجا می‌توانید کدهای واقعی خود را قرار دهید، فعلاً یک فایل تستی خالی است

            // 🔹 تابع ساخت یک رکورد استاندارد Intel HEX با چکسام صحیح
            function makeRecord(type, offset, bytes) {
                let record = [bytes.length, (offset >> 8) & 0xFF, offset & 0xFF, type, ...bytes];
                let sum = record.reduce((a, b) => a + b, 0);
                let checksum = (0x100 - (sum & 0xFF)) & 0xFF; // محاسبه دو's complement
                return ':' + record.map(b => b.toString(16).toUpperCase().padStart(2, '0')).join('') + checksum.toString(16).toUpperCase().padStart(2, '0');
            }

            let hexLines = [];
            // ساخت رکوردهای داده (هر رکورد 16 بایت)
            for (let i = 0; i < data.length; i += 16) {
                let chunk = Array.from(data.slice(i, i + 16));
                hexLines.push(makeRecord(0x00, i, chunk));
            }
            // رکورد پایان فایل
            hexLines.push(makeRecord(0x01, 0x0000, []));

            const hexContent = hexLines.join('\n');

            const blob = new Blob([hexContent], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.download = 'lab.hex';
            a.href = url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
